<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經典復古太空射擊遊戲 - Galaga Style</title>
  <style>
    /* 全局重置，確保全螢幕無邊框與滾動條 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei", sans-serif;
    }

    /* 全螢幕 Canvas 畫布 */
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* 開始與結束畫面覆蓋層 */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      font-size: 2.5rem;
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366, 0 0 20px #ff0055;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    #overlay p {
      font-size: 1.2rem;
      color: #00ffff;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    #startBtn {
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #000;
      background: #00ffff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff;
      transition: all 0.2s ease;
    }

    #startBtn:hover {
      background: #ffffff;
      box-shadow: 0 0 25px #ffffff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- 全螢幕遊戲畫布 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 開始 / 遊戲結束 提示面板 -->
  <div id="overlay">
    <h1 id="overlayTitle">小蜜蜂 GALAGA</h1>
    <p id="overlayDesc">按住 [ ← ][ → ] 或 [ A ][ D ] 移動並自動連發射擊<br>手機裝置可直接按住螢幕拖曳</p>
    <button id="startBtn">開始遊戲</button>
  </div>

  <script>
    // =========================================================================
    // 遊戲核心參數配置區域 (CONFIG) - 可在此調整生命值、速度與 Emoji 圖示
    // =========================================================================
    const CONFIG = {
      // 玩家與生命值設定
      INITIAL_LIVES: 5,        // 玩家初始生命值 (可自由修改)
      PLAYER_SPEED: 1,         // 玩家左右移動速度 (像素/幀)
      AUTO_FIRE_RATE: 120,     // 自動發射間隔時間 (毫秒)，越小發射越快
      BULLET_SPEED: 10,        // 玩家子彈飛向頂部的速度

      // 敵人與難度設定
      ENEMY_BASE_SPEED: 2,     // 敵人在陣型中的擺動速度
      ENEMY_DIVE_SPEED: 3.5,   // 敵人俯衝攻擊速度
      ENEMY_FIRE_CHANCE: 0.008,// 敵人每幀發射子彈的機率

      // 圖示與 Emoji 設定 (可在這裡自訂 Emoji 圖示)
      EMOJIS: {
        BOSS: '👾',            // 大 Boss 圖示 (例如: 👾, 🛸, 👹, 🐲)
        ENEMY_RED: '🦀',       // 紅色螃蟹外星人 (網格陣型)
        ENEMY_GREEN: '🪲',     // 綠色甲蟲外星人 (心形陣型)
        SHIELD_ITEM: '🛡️',     // 防護罩掉落道具
        LIVES_ICON: '❤️'       // HUD 顯示的生命值圖示
      }
    };

    // =========================================================================
    // 初始化環境與狀態變數
    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');

    let width = 0;
    let height = 0;

    // 視窗大小自適應
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      if (player) {
        player.y = height - 70; // 確保戰機保持在底部
      }
    }
    window.addEventListener('resize', resizeCanvas);

    // 按鍵狀態追蹤
    const keys = {
      left: false,
      right: false
    };

    // 遊戲全域狀態
    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
    let score = 0;
    let lives = CONFIG.INITIAL_LIVES;
    let wave = 1;
    let lastShootTime = 0;
    let touchX = null;

    // 遊戲物件陣列
    let player;
    let stars = [];
    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];

    // =========================================================================
    // 遊戲基礎類別 (Classes)
    // =========================================================================

    // 背景星空顆粒
    class Star {
      constructor() {
        this.reset();
        this.y = Math.random() * height; // 初始隨機分散
      }
      reset() {
        this.x = Math.random() * width;
        this.y = 0;
        this.size = Math.random() * 2 + 0.5;
        this.speed = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random() * 0.8 + 0.2;
      }
      update() {
        this.y += this.speed;
        if (this.y > height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 玩家戰機
    class Player {
      constructor() {
        this.width = 40;
        this.height = 40;
        this.x = width / 2 - this.width / 2;
        this.y = height - 70;
        this.shieldActive = false;
        this.shieldTimer = 0;
      }

      update() {
        // 鍵盤操控移動
        if (keys.left && this.x > 0) {
          this.x -= CONFIG.PLAYER_SPEED;
        }
        if (keys.right && this.x < width - this.width) {
          this.x += CONFIG.PLAYER_SPEED;
        }

        // 觸控/滑鼠拖曳操控
        if (touchX !== null) {
          const targetX = touchX - this.width / 2;
          this.x += (targetX - this.x) * 0.2; // 順滑跟隨
          // 限制邊界
          if (this.x < 0) this.x = 0;
          if (this.x > width - this.width) this.x = width - this.width;
        }

        // 防護罩時間倒數
        if (this.shieldActive) {
          this.shieldTimer--;
          if (this.shieldTimer <= 0) {
            this.shieldActive = false;
          }
        }
      }

      // 繪製像素經典戰機 (紅白相間)
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 主機身 (白色)
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(16, 0, 8, 36);
        ctx.fillRect(8, 16, 24, 12);

        // 機翼紅角 (紅色)
        ctx.fillStyle = '#FF0033';
        ctx.fillRect(0, 20, 8, 16);
        ctx.fillRect(32, 20, 8, 16);
        ctx.fillRect(16, 8, 8, 6);

        // 防護罩光圈特效
        if (this.shieldActive) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(20, 20, 30 + Math.sin(Date.now() / 100) * 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // 外星敵人 (支援普通敵人與大 Boss Emoji 渲染)
    class Enemy {
      constructor(x, y, type) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.type = type; // 'GREEN', 'RED', 'BOSS'
        this.width = type === 'BOSS' ? 60 : 36;
        this.height = type === 'BOSS' ? 60 : 36;

        // Boss 血量判定
        this.hp = type === 'BOSS' ? 25 + wave * 5 : 1;
        this.maxHp = this.hp;

        // 俯衝與擺動狀態
        this.isDiving = false;
        this.diveAngle = 0;
        this.diveSpeed = CONFIG.ENEMY_DIVE_SPEED;
        this.swingOffset = Math.random() * Math.PI * 2;
      }

      update(formationTime) {
        if (!this.isDiving) {
          // 隊伍陣型擺動 (左右浮動)
          const swing = Math.sin(formationTime * 0.003 + this.swingOffset) * 40;
          this.x = this.startX + swing;
          this.y = this.startY + Math.sin(formationTime * 0.002) * 10;

          // 隨機發起俯衝
          if (Math.random() < 0.0008 * wave && this.type !== 'BOSS') {
            this.isDiving = true;
          }
        } else {
          // 俯衝軌跡邏輯
          this.y += this.diveSpeed;
          this.x += Math.sin(this.diveAngle) * 3;
          this.diveAngle += 0.05;

          // 俯衝超越底部後，回歸上方陣型
          if (this.y > height) {
            this.y = -50;
            this.isDiving = false;
          }
        }

        // 隨機發射子彈
        if (Math.random() < CONFIG.ENEMY_FIRE_CHANCE && this.y > 0 && this.y < height - 100) {
          enemyBullets.push(new Bullet(this.x + this.width / 2, this.y + this.height, 4, '#ff3300', true));
        }
      }

      draw() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (this.type === 'BOSS') {
          // 繪製大 Boss (使用 Emoji)
          ctx.font = '96px sans-serif';

          // Boss 紫紅色脈衝光暈
          ctx.shadowColor = this.hp < this.maxHp * 0.5 ? '#ff0000' : '#aa00ff';
          ctx.shadowBlur = 15 + Math.sin(Date.now() / 150) * 10;

          ctx.fillText(CONFIG.EMOJIS.BOSS, this.x + this.width / 2, this.y + this.height / 2);

          // 繪製 Boss 血條
          ctx.shadowBlur = 0;
          const barWidth = 50;
          const barHeight = 6;
          const healthRatio = this.hp / this.maxHp;
          ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
          ctx.fillRect(this.x + (this.width - barWidth) / 2, this.y - 12, barWidth, barHeight);
          ctx.fillStyle = '#00ffcc';
          ctx.fillRect(this.x + (this.width - barWidth) / 2, this.y - 12, barWidth * healthRatio, barHeight);
        } else {
          // 普通敵人 (使用 Emoji 渲染)
          ctx.font = '28px sans-serif';
          const emoji = this.type === 'RED' ? CONFIG.EMOJIS.ENEMY_RED : CONFIG.EMOJIS.ENEMY_GREEN;
          ctx.fillText(emoji, this.x + this.width / 2, this.y + this.height / 2);
        }

        ctx.restore();
      }
    }

    // 子彈類別
    class Bullet {
      constructor(x, y, speed, color, isEnemy = false) {
        this.x = x;
        this.y = y;
        this.speed = speed;
        this.color = color;
        this.isEnemy = isEnemy;
        this.width = 4;
        this.height = 12;
      }
      update() {
        if (this.isEnemy) {
          this.y += this.speed;
        } else {
          this.y -= this.speed;
        }
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
        ctx.shadowBlur = 0;
      }
    }

    // 爆炸粒子特效
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
        this.size = Math.random() * 4 + 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.02;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1;
      }
    }

    // 掉落道具 (護盾)
    class PowerUp {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 2;
        this.size = 24;
      }
      update() {
        this.y += this.speed;
      }
      draw() {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(CONFIG.EMOJIS.SHIELD_ITEM, this.x, this.y);
      }
    }

    // =========================================================================
    // 關卡與陣型建立 (Formations)
    // =========================================================================

    function createWave(waveNum) {
      enemies = [];
      const centerX = width / 2;

      // 每 3 關觸發一次 Boss 戰
      if (waveNum % 3 === 0) {
        enemies.push(new Enemy(centerX - 30, 100, 'BOSS'));
        return;
      }

      // 波次 1, 4, 7... 心形陣型 (同截圖一)
      if (waveNum % 3 === 1) {
        const heartCoords = [
          { r: 0, c: 0 },
          { r: -1, c: -1 }, { r: -1, c: 1 },
          { r: -2, c: -2 }, { r: -2, c: 2 },
          { r: -3, c: -2.5 }, { r: -3, c: -1 }, { r: -3, c: 1 }, { r: -3, c: 2.5 },
          { r: -4, c: -1.8 }, { r: -4, c: 1.8 }
        ];

        heartCoords.forEach(pt => {
          const x = centerX + pt.c * 45 - 18;
          const y = 220 + pt.r * 40;
          enemies.push(new Enemy(x, y, 'GREEN'));
        });
      } 
      // 波次 2, 5, 8... 經典網格陣型 (同截圖二)
      else {
        const rows = 5;
        const cols = 7;
        const spacingX = 45;
        const spacingY = 35;
        const startX = centerX - (cols * spacingX) / 2;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = startX + c * spacingX;
            const y = 80 + r * spacingY;
            const type = r < 2 ? 'RED' : 'GREEN';
            enemies.push(new Enemy(x, y, type));
          }
        }
      }
    }

    // 生成爆炸特效
    function createExplosion(x, y, color = '#ffcc00', count = 15) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    // 自動發射子彈邏輯 (當按住方向鍵或觸控時)
    function handleAutoFire(now) {
      if (now - lastShootTime > CONFIG.AUTO_FIRE_RATE) {
        // 發射雙發子彈
        playerBullets.push(new Bullet(player.x + 8, player.y, CONFIG.BULLET_SPEED, '#ff0033'));
        playerBullets.push(new Bullet(player.x + player.width - 8, player.y, CONFIG.BULLET_SPEED, '#ff0033'));
        lastShootTime = now;
      }
    }

    // =========================================================================
    // 遊戲主循環 (Main Game Loop)
    // =========================================================================

    function initGame() {
      score = 0;
      lives = CONFIG.INITIAL_LIVES;
      wave = 1;
      playerBullets = [];
      enemyBullets = [];
      particles = [];
      powerups = [];

      // 初始化背景星空
      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push(new Star());
      }

      player = new Player();
      createWave(wave);
    }

    function update(now) {
      if (gameState !== 'PLAYING') return;

      // 更新星空
      stars.forEach(s => s.update());

      // 更新玩家
      player.update();

      // 當方向鍵被按住或螢幕被觸控時，自動連發射擊
      if (keys.left || keys.right || touchX !== null) {
        handleAutoFire(now);
      }

      // 更新玩家子彈
      playerBullets.forEach((b, index) => {
        b.update();
        if (b.y < -20) playerBullets.splice(index, 1);
      });

      // 更新敵人子彈
      enemyBullets.forEach((b, index) => {
        b.update();
        if (b.y > height + 20) enemyBullets.splice(index, 1);

        // 碰撞檢測：敵人子彈擊中玩家
        if (
          b.x > player.x &&
          b.x < player.x + player.width &&
          b.y > player.y &&
          b.y < player.y + player.height
        ) {
          enemyBullets.splice(index, 1);
          if (!player.shieldActive) {
            lives--;
            createExplosion(player.x + 20, player.y + 20, '#ff0000', 25);
            if (lives <= 0) {
              gameOver();
            }
          } else {
            createExplosion(b.x, b.y, '#00ffff', 5); // 護盾抵擋特效
          }
        }
      });

      // 更新敵人與碰撞檢測
      enemies.forEach((enemy, eIndex) => {
        enemy.update(now);

        // 玩家子彈擊中敵人
        playerBullets.forEach((b, bIndex) => {
          if (
            b.x > enemy.x &&
            b.x < enemy.x + enemy.width &&
            b.y > enemy.y &&
            b.y < enemy.y + enemy.height
          ) {
            playerBullets.splice(bIndex, 1);
            enemy.hp--;

            // 子彈撞擊火花
            createExplosion(b.x, b.y, '#ffff00', 4);

            if (enemy.hp <= 0) {
              createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff6600', 20);
              
              // 隨機掉落防護罩道具 (10% 機率)
              if (Math.random() < 0.1) {
                powerups.push(new PowerUp(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2));
              }

              score += enemy.type === 'BOSS' ? 500 : (enemy.type === 'RED' ? 100 : 50);
              enemies.splice(eIndex, 1);
            }
          }
        });

        // 敵人撞擊玩家
        if (
          enemy.x < player.x + player.width &&
          enemy.x + enemy.width > player.x &&
          enemy.y < player.y + player.height &&
          enemy.y + enemy.height > player.y
        ) {
          if (!player.shieldActive) {
            lives--;
            createExplosion(player.x + 20, player.y + 20, '#ff0000', 30);
            if (enemy.type !== 'BOSS') enemies.splice(eIndex, 1);
            if (lives <= 0) gameOver();
          }
        }
      });

      // 更新與撿取防護罩道具
      powerups.forEach((p, index) => {
        p.update();
        if (p.y > height + 30) powerups.splice(index, 1);

        if (
          Math.abs(p.x - (player.x + player.width / 2)) < 30 &&
          Math.abs(p.y - (player.y + player.height / 2)) < 30
        ) {
          powerups.splice(index, 1);
          player.shieldActive = true;
          player.shieldTimer = 300; // 防護罩持續約 5 秒
        }
      });

      // 更新粒子特效
      particles.forEach((p, index) => {
        p.update();
        if (p.alpha <= 0) particles.splice(index, 1);
      });

      // 檢查是否消滅當前波次所有敵人
      if (enemies.length === 0) {
        wave++;
        createWave(wave);
      }
    }

    function render() {
      // 清空畫布 (黑色深空)
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // 繪製背景星空
      stars.forEach(s => s.draw());

      if (gameState === 'PLAYING') {
        // 繪製遊戲物件
        player.draw();
        enemies.forEach(e => e.draw());
        playerBullets.forEach(b => b.draw());
        enemyBullets.forEach(b => b.draw());
        powerups.forEach(p => p.draw());
        particles.forEach(p => p.draw());

        // 繪製抬頭顯示器 (HUD)
        renderHUD();
      }
    }

    // 繪製霓虹風格 HUD (得分、波次與生命值)
    function renderHUD() {
      ctx.save();
      ctx.font = 'bold 18px "Courier New", monospace';
      
      // 得分 (左上角)
      ctx.fillStyle = '#00ffff';
      ctx.fillText(`SCORE: ${score}`, 20, 35);

      // 波次 (中間頂部)
      ctx.fillStyle = '#ffff00';
      ctx.textAlign = 'center';
      ctx.fillText(`WAVE ${wave}`, width / 2, 35);

      // 生命值 (右上角，以 ❤️ 呈現)
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff0055';
      let livesText = '';
      for (let i = 0; i < lives; i++) {
        livesText += CONFIG.EMOJIS.LIVES_ICON;
      }
      ctx.fillText(livesText, width - 20, 35);

      ctx.restore();
    }

    // 主循環
    function loop(now) {
      update(now);
      render();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      overlayTitle.innerText = 'GAME OVER';
      overlayDesc.innerHTML = `最終得分: <b style="color:#ffff00">${score}</b><br>挑戰關卡: 第 ${wave} 波`;
      startBtn.innerText = '再次挑戰';
      overlay.style.display = 'flex';
    }

    // =========================================================================
    // 控制事件監聽 (鍵盤、滑鼠與觸控)
    // =========================================================================

    // 鍵盤按下事件：按住左右鍵時自動開啟發射
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
      }
    });

    // 鍵盤放開事件
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = false;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = false;
      }
    });

    // 手機觸控 / 滑鼠拖曳控制
    window.addEventListener('touchstart', (e) => {
      if (gameState === 'PLAYING') {
        touchX = e.touches[0].clientX;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (gameState === 'PLAYING') {
        touchX = e.touches[0].clientX;
      }
    });

    window.addEventListener('touchend', () => {
      touchX = null;
    });

    // 開始按鈕點擊
    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      initGame();
      gameState = 'PLAYING';
    });

    // 啟動遊戲引擎
    resizeCanvas();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
